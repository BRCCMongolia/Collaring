<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<style>
/* Тайван өнгө: цайвар ногоовтор дэвсгэр, гүн ногоон-хөх товч. Стресстэй үед нүдэнд зөөлөн, нарны гэрэлд тод. */
:root{
  --bg:#EEF2EC; --card:#FBFCF9; --ink:#13201B; --muted:#41524B; --line:#D2DDD5;
  --pri:#2F6A5C; --pri-d:#224F45; --pri-l:#DCEBE5; --pri-ink:#FFFFFF;
  --ok:#4E7F3A; --ok-l:#E2EDD8; --warn:#A8701C; --warn-l:#F8EBCF; --bad:#B0443A; --bad-l:#F5DEDA;
  --bg-0:rgba(238,242,236,0); --bg-t:rgba(238,242,236,.92); --shadow:0 1px 2px rgba(20,50,40,.08); --r:12px; --tap:52px;
}
body.night{
  --bg:#141B19; --bg-0:rgba(20,27,25,0); --bg-t:rgba(20,27,25,.92); --card:#1D2623; --ink:#EEF5F1; --muted:#B8C9C1; --line:#33443E;
  --pri:#6DB3A1; --pri-d:#A6D8CB; --pri-l:#1F3631; --pri-ink:#0F1A17;
  --ok:#93B66E; --ok-l:#26331F; --warn:#E3AE57; --warn-l:#3A2F18; --bad:#E58A7E; --bad-l:#3E2522;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:18px;line-height:1.4;font-weight:500;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650} h2{font-size:1.15rem} h3{font-size:1.02rem}
.app{max-width:760px;margin:0 auto;min-height:100vh}
.page{padding:0 16px 110px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tt{font-weight:650;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ts{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.logo-sm{height:34px} .logo-lg{width:150px;display:block;margin:14px auto 4px}
.iconbtn{min-width:46px;height:46px;border:0;background:transparent;border-radius:var(--r);font-size:1.45rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--pri-l)}
.hero{text-align:center;margin:4px 0 14px} .hero h1{font-size:1.5rem;color:var(--pri-d)} .hero p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.card.link{display:block;width:100%;text-align:left;cursor:pointer;border-left:6px solid var(--pri)} .card.link:active{background:var(--pri-l)}
.card.done{border-left-color:var(--ok)} .card.abort{border-left-color:var(--muted)}
.ct{font-weight:650;font-size:1.05rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .cs{color:var(--muted);font-size:.9rem;margin-top:2px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--pri-l);color:var(--pri-d)}
.tag.ok{background:var(--ok-l);color:var(--ok)} .tag.warn{background:var(--warn-l);color:var(--warn)} .tag.bad{background:var(--bad-l);color:var(--bad)} .tag.mut{background:var(--line);color:var(--muted)}
.btn{min-height:var(--tap);padding:10px 16px;border-radius:var(--r);border:1px solid transparent;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.pri{background:var(--pri);color:var(--pri-ink)} .btn.pri:active{background:var(--pri-d)}
.btn.sec{background:var(--pri-l);color:var(--pri-d)}
.btn.ghost{background:var(--card);border-color:var(--line)}
.btn.okb{background:var(--ok);color:#fff} .btn.badb{background:var(--bad);color:#fff}
.btn.danger{background:var(--card);color:var(--bad);border-color:var(--bad-l)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.93rem}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.bigbtn{display:flex;width:100%;min-height:84px;font-size:1.4rem;border-radius:18px;margin:4px 0 0;box-shadow:0 3px 0 var(--pri-d);position:relative}
.bigbtn .stepno{position:absolute;left:14px;top:8px;font-size:.75rem;font-weight:700;opacity:.75}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(var(--bg-0),var(--bg) 22%);padding:16px 16px calc(10px + env(safe-area-inset-bottom))}
.nextbar .in{max-width:728px;margin:0 auto}
body.night .nextbar{background:linear-gradient(rgba(33,27,21,0),var(--bg) 22%)}
.page{padding-bottom:150px}
.missing{background:var(--bad-l);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:8px 12px;font-weight:650;font-size:.92rem;margin-bottom:10px}
.missing span{font-weight:400;opacity:.85}
.row{display:flex;gap:8px;align-items:center} .row.wrap{flex-wrap:wrap} .row.between{justify-content:space-between} .row>*{min-width:0}
.mt{margin-top:10px} .mb{margin-bottom:10px} .center{text-align:center}
.field{margin-bottom:12px} .lbl{display:block;font-size:.92rem;color:var(--ink);font-weight:700;margin-bottom:5px}
.inp{width:100%;min-height:var(--tap);padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-size:1.05rem}
.inp:focus{outline:3px solid var(--pri-l);border-color:var(--pri)}
.ta{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.98rem}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:650}
.chip.okc.on{background:var(--ok);border-color:var(--ok);color:#fff} .chip.badc.on{background:var(--bad);border-color:var(--bad);color:#fff}
.muted{color:var(--muted)} .small{font-size:.86rem} .hint{font-size:.9rem;color:var(--muted);margin-top:4px}
.empty{padding:26px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--card)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.group-h{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:none;margin:14px 2px 6px}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin:28px 4px 0;line-height:1.5} .foot a{color:var(--pri-d)} .foot p{margin:10px 0 0}
.qrbox{background:#fff;border-radius:14px;padding:8px;max-width:420px;margin:0 auto} .qrbox svg{display:block;width:100%;height:auto}
.nophoto{width:84px;height:84px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);text-align:center}
body.big{font-size:21px}
.inp{color:var(--ink);font-weight:600} .inp::placeholder{color:#8A9A93;font-weight:400}
.chip{font-weight:600}
/* алхмын том товч */
.bigbtn{background:linear-gradient(135deg,#3A7B6A,#275749);min-height:88px;flex-direction:column;gap:2px;line-height:1.15}
.bigbtn .ico{font-size:1.6rem;line-height:1}
.bigbtn .sub{font-size:.8rem;font-weight:600;opacity:.9}
.bigbtn.go{background:radial-gradient(circle at 30% 20%,#5FA48C,#2F6A5C 55%,#1F4A40);min-height:104px;font-size:1.6rem;box-shadow:0 4px 0 #173A32,0 10px 24px rgba(47,106,92,.35);animation:breathe 2.4s ease-in-out infinite}
.bigbtn.go .ico{font-size:2rem}
@keyframes breathe{50%{box-shadow:0 4px 0 #173A32,0 14px 30px rgba(47,106,92,.5)}}
.bigbtn.shoot{background:linear-gradient(135deg,#3D6A86,#284B63);box-shadow:0 4px 0 #1B3547}
.bigbtn:disabled{background:#A9B8B1;box-shadow:none;animation:none}
/* загвар */
:root{--r:16px;--shadow:0 1px 2px rgba(80,50,20,.06),0 6px 18px rgba(80,50,20,.07)}
.topbar{background:var(--bg-t);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.night .topbar{background:rgba(33,27,21,.92)}
.card{border-color:transparent}
.card.link{border-left-width:7px}
.card h3{font-size:1.08rem;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--pri)}
.hero h1{font-size:1.7rem;letter-spacing:-.01em} .logo-lg{width:140px;border-radius:12px}
.btn{border-radius:14px} .btn.ghost{box-shadow:var(--shadow);border-color:transparent}
.btn.pri:not(.bigbtn){background:linear-gradient(135deg,#3A7B6A,#275749);box-shadow:0 3px 0 #173A32}
.chip{box-shadow:0 1px 2px rgba(80,50,20,.06)}
.panel{border-radius:20px;box-shadow:var(--shadow)}
.clock{font-size:3.8rem}
.stat{border-radius:12px} .stat b{font-size:1.5rem}
.tl .dot{width:28px;height:28px;flex-basis:28px}
.tag{border-radius:8px;padding:3px 9px}
/* хайдаг сонголт */
.sp-wrap{position:relative}
.sp-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(60,35,10,.18);max-height:46vh;overflow:auto;margin-top:4px}
.sp-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px;font-size:1.02rem;cursor:pointer}
.sp-item:last-child{border-bottom:0} .sp-item:active,.sp-item.on{background:var(--pri-l);font-weight:650}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.tl .dot{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;background:var(--line);color:var(--muted)}
.tl li.done .dot{background:var(--ok);color:#fff} .tl li.skip .dot{background:var(--card);border:1px dashed var(--muted)} .tl li.cur .dot{background:var(--pri);color:var(--pri-ink)}
.tl .tm,.kv .tm{font-variant-numeric:tabular-nums;font-weight:650;cursor:pointer;color:var(--pri-d);background:none;border:0;padding:0}
.tl .dur{font-size:.84rem;color:var(--muted)}
/* timers */
.clock{font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em;line-height:1.1}
.clock.sm{font-size:2.2rem}
.panel{border-radius:16px;padding:14px;border:2px solid var(--line);background:var(--card);margin:10px 0}
.panel.warn{border-color:var(--warn);background:var(--warn-l)}
.panel.stop{border-color:var(--bad);background:var(--bad-l);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(178,58,46,.25)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center} .stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums} .stat span{font-size:.8rem;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px} .bar>i{display:block;height:100%;background:var(--ok)}
.bar.w>i{background:var(--warn)} .bar.s>i{background:var(--bad)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(12px + env(safe-area-inset-bottom))}
.sticky .in{max-width:728px;margin:0 auto}
.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center} .speed div{background:var(--pri-l);border-radius:12px;padding:8px 4px} .speed b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--pri-d)} .speed span{font-size:.8rem;color:var(--muted)}
.missing.mini{display:inline-block;width:auto;padding:4px 12px;font-size:.85rem;font-family:inherit;cursor:pointer}
.field.miss .lbl{color:var(--bad)} .dutuu{margin-left:8px;font-size:.75rem;font-weight:700;background:var(--bad-l);color:var(--bad);padding:1px 7px;border-radius:6px}
.field.miss .inp,.field.miss .chip{border-color:var(--bad);border-width:2px} .field.miss .btn.sec{box-shadow:0 0 0 2px var(--bad)}
.vetbar{gap:10px} .vetbar .bigbtn{flex:1;min-height:84px;font-size:1.35rem;box-shadow:none} .btn.okb.bigbtn{background:linear-gradient(135deg,#5C9447,#3E6E2E)} .btn.badb.bigbtn{background:linear-gradient(135deg,#B85A4F,#8E3A31)}
.mini{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phlist{display:flex;flex-direction:column;gap:10px} .ph{display:flex;gap:10px;align-items:flex-start} .ph img,.ph .nophoto{width:84px;height:84px;flex:none;object-fit:cover;border-radius:10px;border:1px solid var(--line)} .phname{font-size:.85rem;color:var(--muted);margin-bottom:4px;word-break:break-all}
.photos{display:flex;gap:8px;flex-wrap:wrap} .photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.vit{background:var(--bg);border-radius:12px;padding:8px 10px 10px;margin-bottom:8px} .sample{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg);border-radius:8px;margin-top:6px;font-variant-numeric:tabular-nums;font-weight:650}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:550} .check input{width:24px;height:24px;accent-color:var(--pri)}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
table.kv{width:100%;border-collapse:collapse;font-size:.95rem} table.kv td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top} table.kv td:first-child{color:var(--muted);width:48%}
.coord{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;font-size:1.35rem;font-weight:750;font-variant-numeric:tabular-nums;background:var(--pri-l);color:var(--ink,inherit);border:0;border-radius:12px;padding:12px 14px;margin-bottom:6px;cursor:pointer;text-align:left} .coord span{font-size:.8rem;font-weight:650;color:var(--pri)} a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.fold-h{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;border-bottom:2px solid var(--line);color:var(--ink);font:inherit;font-size:1.05rem;font-weight:750;padding:12px 4px 8px;margin:10px 0 10px;cursor:pointer;text-align:left}
.loc-h{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:var(--muted);font:inherit;font-size:.95rem;font-weight:650;padding:4px 4px 8px;cursor:pointer;text-align:left} .report h3{margin:0 0 10px;font-size:1.15rem} .report h3.mt{margin-top:22px;padding-top:14px;border-top:1px solid var(--line,#dde5df)} .rep-h{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:var(--ink);font:inherit;font-size:1.15rem;font-weight:750;padding:4px 0 10px;cursor:pointer;text-align:left} .rep-h.sub{font-size:1rem;font-weight:650;padding:8px 0 6px} .report .sep2{border-top:1px solid var(--line,#dde5df);margin:14px 0 10px} .crow{background:var(--bg);border-radius:12px;margin:0 0 8px;overflow:hidden} .crow-h{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer} .crow-h>span:last-child{color:var(--pri-d);font-size:.85rem;white-space:nowrap} .cdet{padding:0 12px 12px} .crow b{font-size:1.05rem} .report h4{margin:14px 0 6px;font-size:1rem} .report .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .report .stat b{font-size:1.2rem}
</style>
</head>
